[package]
name = "dust-nbt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2.workspace = true

[dev-dependencies]
# The same crate the library uses. The tests need it directly because the
# external corpus lives inside the server jar, and reading a jar means
# inflating deflate streams — see `tests/support/mod.rs`.
flate2.workspace = true

# The generated-document suites: round-trips through both binary dialects and
# the SNBT printer/parser differential. The strategies live with the rest of
# the test plumbing in `tests/support/mod.rs`.
proptest = "1"

# A stopwatch and nothing else; see the note at the top of the bench.
[[bench]]
name = "synthetic"
harness = false

[lints.rust]
# The stub of this crate opted out of the workspace `unsafe_code = "deny"` in
# anticipation of a zero-copy reader that would need it. The implementation
# turned out not to: see the `Tag::String` note in `src/tag.rs` for why nothing
# in NBT can be borrowed from the input in the general case, which removed the
# reason for the exception. The deny is back, so the exception is not sitting
# open for a later change to walk through.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"
