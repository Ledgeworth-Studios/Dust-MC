[package]
name = "dust-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# gzip and zlib, which region files use and Dust does not get to choose. The
# pure-Rust backend is selected explicitly: the C `zlib-sys` backends would put
# a build-time C toolchain between a contributor and a working checkout, and
# nothing here is hot enough to need them.
flate2 = { workspace = true }

# Comparative costs on fixed workloads -- palette promotions, region round
# trips, light walks over a full column -- timed with a stopwatch and printed,
# the same shape as `dust-nbt`'s bench. A framework brings statistics and a
# dozen dependencies to answer questions these are too coarse for anyway; see
# the note at the top of the bench.
[[bench]]
name = "workloads"
harness = false

[lints]
workspace = true
