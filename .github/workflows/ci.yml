# The pull-request gate. Linux only, under ten minutes.
#
# The step list below is `just verify`, in the same order, one step per recipe.
# It is written out rather than shelling straight into `just verify` so a
# failure names the stage that failed in the GitHub UI — but the recipes are the
# same recipes, so a green local run means a green remote one.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      - name: Formatting
        run: just fmt-check

      - name: Lints
        run: just lint

      - name: Tests
        run: just test

      - name: Configuration reference is up to date
        run: just docs-check

      - name: Dependency licences
        run: just licenses

      - name: Build
        run: just build

      # trybuild compiles the compile-fail cases in a workspace of its own under
      # target/tests/, with a nested target directory the cache action's cleanup
      # walk cannot open. It is only a warning, and a warning that is always
      # there teaches people to stop reading warnings. Post steps run in reverse
      # order, so removing it here is removing it before the cache runs.
      - name: Remove trybuild's nested workspace before the cache step
        if: always()
        run: rm -rf target/tests
